<body class="main-body">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <i class="fa-solid fa-sun theme-icon theme-icon-sun" aria-hidden="true"></i>

    </button>
    
     <div id="loader">
    <div class="loader-content">

      <div class="brand">Saumiya's Portfolio</div>

      <div class="chart">
        <svg viewBox="0 0 360 120" preserveAspectRatio="none">
          <defs>
            <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2563eb"/>
              <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <path
            class="chart-area"
            d="M0,105 L0,90 L55,75 L105,85 L155,45 L205,65 L255,25 L310,45 L360,15 L360,120 L0,120 Z">
          </path>

          <path
            class="chart-line"
            d="M0,90 L55,75 L105,85 L155,45 L205,65 L255,25 L310,45 L360,15">
          </path>

          <circle class="chart-dot" cx="360" cy="15" r="4"></circle>
        </svg>
      </div>

      <h1 class="title">Preparing your insights</h1>
      <p class="status" id="status">Loading portfolio...</p>

    </div>
  </div>
  <main>
    <h1>Welcome to My Portfolio</h1>
    <p>Data Analyst | Future Data Scientist</p>
    <!-- The developer scene visualizes the dashboard being assembled piece by piece. -->
    <div class="dashboard-scene" role="img" aria-label="A developer wearing glasses works on a MacBook while chart cards float toward a dashboard board">
      <svg class="dashboard-scene-art" viewBox="0 0 720 250" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="board-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.98" />
            <stop offset="1" stop-color="#dbeafe" stop-opacity="0.9" />
          </linearGradient>
          <filter id="board-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16" />
          </filter>
        </defs>

        <path class="scene-wall-line" d="M34 201H686" />
        <rect class="dashboard-board" x="365" y="26" width="300" height="165" rx="12" filter="url(#board-shadow)" />
        <path class="board-header-line" d="M390 59H640" />
        <circle class="board-dot" cx="391" cy="44" r="4" />
        <circle class="board-dot board-dot-muted" cx="405" cy="44" r="4" />
        <circle class="board-dot board-dot-muted" cx="419" cy="44" r="4" />

        <g class="board-chart board-chart-one">
          <rect x="390" y="77" width="105" height="88" rx="8" />
          <path d="M406 144L430 125L447 133L472 99" />
          <circle cx="406" cy="144" r="3" /><circle cx="430" cy="125" r="3" /><circle cx="447" cy="133" r="3" /><circle cx="472" cy="99" r="3" />
        </g>
        <g class="board-chart board-chart-two">
          <rect x="510" y="77" width="130" height="40" rx="8" />
          <rect class="mini-bar mini-bar-one" x="527" y="91" width="9" height="14" rx="3" />
          <rect class="mini-bar mini-bar-two" x="544" y="85" width="9" height="20" rx="3" />
          <rect class="mini-bar mini-bar-three" x="561" y="96" width="9" height="9" rx="3" />
          <rect class="mini-bar mini-bar-four" x="578" y="81" width="9" height="24" rx="3" />
          <rect class="mini-bar mini-bar-five" x="595" y="88" width="9" height="17" rx="3" />
        </g>
        <g class="board-chart board-chart-three">
          <rect x="510" y="125" width="130" height="40" rx="8" />
          <circle class="donut-base" cx="538" cy="145" r="13" />
          <path class="donut-progress" d="M538 132A13 13 0 1 1 527 152" />
          <rect class="legend-line" x="565" y="139" width="47" height="5" rx="2.5" />
          <rect class="legend-line legend-line-short" x="565" y="149" width="31" height="5" rx="2.5" />
        </g>

        <!-- The laptop back faces the viewer while its open screen faces the developer. -->
        <g class="developer">
          <path class="developer-hood" d="M126 208Q130 144 180 137Q230 144 244 208Z" />
          <path class="developer-shirt" d="M142 156Q180 139 220 156L232 208H130Z" />
          <circle class="developer-head" cx="180" cy="102" r="43" />
          <path class="developer-hair" d="M140 101Q139 56 181 54Q222 55 221 102Q207 78 183 77Q157 80 140 101Z" />
          <path class="developer-cap" d="M141 84Q146 51 181 49Q215 51 222 84Q183 70 141 84Z" />
          <path class="developer-cap-brim" d="M139 83Q168 76 207 83Q189 94 145 91Z" />
          <path class="developer-glasses" d="M145 98H171Q175 98 175 103V107Q175 112 170 112H150Q145 112 145 107ZM185 103Q185 98 190 98H215Q219 98 219 103V107Q219 112 214 112H190Q185 112 185 107ZM175 102H185" />
          <circle class="developer-eye developer-eye-left" cx="161" cy="105" r="3" /><circle class="developer-eye developer-eye-right" cx="202" cy="105" r="3" />
          <path class="developer-face" d="M174 121Q180 125 186 121" />
          <path class="hoodie-cord hoodie-cord-left" d="M166 157V180" /><path class="hoodie-cord hoodie-cord-right" d="M194 157V180" />
          <circle class="hoodie-toggle" cx="166" cy="181" r="3" /><circle class="hoodie-toggle" cx="194" cy="181" r="3" />
          <path class="developer-arm developer-arm-back" d="M145 156Q185 157 220 192" />
          <path class="developer-arm developer-arm-front" d="M218 157Q194 168 171 193" />
          <circle class="developer-hand developer-hand-back" cx="220" cy="192" r="9" />
          <circle class="developer-hand developer-hand-front" cx="171" cy="193" r="9" />
        </g>

        <!-- The 16:9 laptop lid is in front of the hands, making the developer look seated and working. -->
        <g class="laptop">
          <rect class="laptop-lid" x="105" y="148" width="150" height="84.375" rx="7" />
          <g class="microsoft-logo">
            <rect x="174" y="181" width="10" height="10" /><rect x="187" y="181" width="10" height="10" />
            <rect x="174" y="194" width="10" height="10" /><rect x="187" y="194" width="10" height="10" />
          </g>
          <path class="laptop-base" d="M95 232.375H265L277 239.375H83Z" />
          <path class="laptop-highlight" d="M111 232.375H249" />
        </g>

        <g class="chart-card chart-card-line">
          <rect width="72" height="45" rx="7" />
          <path d="M12 32L25 23L36 27L51 13L61 18" />
        </g>
        <g class="chart-card chart-card-bars">
          <rect width="72" height="45" rx="7" />
          <rect class="card-bar" x="13" y="25" width="7" height="11" rx="2" /><rect class="card-bar" x="25" y="18" width="7" height="18" rx="2" /><rect class="card-bar" x="37" y="27" width="7" height="9" rx="2" /><rect class="card-bar" x="49" y="12" width="7" height="24" rx="2" />
        </g>
        <g class="chart-card chart-card-donut">
          <rect width="72" height="45" rx="7" />
          <circle class="card-donut-base" cx="23" cy="22" r="11" /><path class="card-donut-progress" d="M23 11A11 11 0 1 1 14 27" />
          <rect x="41" y="17" width="20" height="5" rx="2" /><rect x="41" y="26" width="13" height="5" rx="2" />
        </g>
